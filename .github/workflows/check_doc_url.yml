name: Check Documentation and Package

on:
  push:
    branches:
      - main
      - v0.*
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:

jobs:
  check_pypi_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

  check_doc_urls:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run doc URL validation test
        run: pytest tests/doc/test_docs_urls.py -v

  check_links:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README and documentation links
        run: python3 tests/special_sanity/check_links.py --branch "${{ github.base_ref || github.ref_name }}"
